[project]
name = "forrarse"
version = "0.1.0"
description = "Proyecto FORRARSE — Sistema multi-agente para negocios online. CEO: Durruti. Equipo: Scout (oportunidades) + Domenech (Builder)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Equipo Durruti" }
]
dependencies = [
    "anthropic>=0.40.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    # Telegram
    "python-telegram-bot>=20.7",
    # Voz entrante (STT)
    "SpeechRecognition>=3.10.0",
    "pydub>=0.25.0",
    "playsound3>=3.3.1",
    "edge-tts>=7.2.8",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.1",
    "numpy>=2.4.4",
    "faster-whisper>=1.2.1",
    "groq>=1.2.0",
    "pywin32>=311",
    "duckduckgo-search>=8.1.1",
    "beautifulsoup4>=4.14.3",
    "requests>=2.33.1",
    "fpdf2>=2.8.7",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "agents", "scripts"]
